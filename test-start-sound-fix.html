<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Start Sound Fix</title>
</head>
<body>
    <h1>Start Sound Fix Test</h1>
    <button onclick="testBoyStartSound()">Test Boy Start Sound</button>
    <button onclick="testGirlStartSound()">Test Girl Start Sound</button>
    <div id="output"></div>

    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }

        function testBoyStartSound() {
            log('🔊 Testing boy start sound...');
            const audio = new Audio('/sounds/boy sound/start.wav');
            audio.volume = 0.5;
            
            audio.addEventListener('loadeddata', () => {
                log('✅ Boy start sound loaded successfully');
            });
            
            audio.addEventListener('error', (e) => {
                log('❌ Error loading boy start sound: ' + e.type);
            });
            
            audio.play()
                .then(() => {
                    log('✅ Boy start sound playing');
                })
                .catch(error => {
                    log('❌ Could not play boy start sound: ' + error.message);
                });
        }

        function testGirlStartSound() {
            log('🔊 Testing girl start sound...');
            const audio = new Audio('/sounds/girl sound/start.mp3');
            audio.volume = 0.5;
            
            audio.addEventListener('loadeddata', () => {
                log('✅ Girl start sound loaded successfully');
            });
            
            audio.addEventListener('error', (e) => {
                log('❌ Error loading girl start sound: ' + e.type);
            });
            
            audio.play()
                .then(() => {
                    log('✅ Girl start sound playing');
                })
                .catch(error => {
                    log('❌ Could not play girl start sound: ' + error.message);
                });
        }
    </script>
</body>
</html>
