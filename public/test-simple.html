<!DOCTYPE html>
<html>
<head>
    <title>Simple Sound Test</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🔊 Simple Sound Test</h1>
    <p>Click buttons to test if local sounds work:</p>
    
    <button onclick="playSound(1)">Play Sound 1</button>
    <button onclick="playSound(5)">Play Sound 5</button>
    <button onclick="playSound(10)">Play Sound 10</button>
    <br>
    <button onclick="playSound('winner')">Play Winner</button>
    <button onclick="playSound('notwinner')">Play Not Winner</button>
    
    <div id="status"></div>

    <script>
        const status = document.getElementById('status');
        
        function log(msg) {
            status.innerHTML += msg + '<br>';
            console.log(msg);
        }
        
        function playSound(num) {
            let path;
            if (num === 'winner') {
                path = '/sounds/winner.wav';
            } else if (num === 'notwinner') {
                path = '/sounds/notwinner.wav';
            } else {
                path = `/sounds/${num}.wav`;
            }
            
            log(`🔊 Attempting to play: ${path}`);
            
            const audio = new Audio(path);
            audio.volume = 0.7;
            
            audio.onloadeddata = () => {
                log(`✅ Loaded: ${path}`);
            };
            
            audio.onerror = (e) => {
                log(`❌ Error: ${path} - ${audio.error?.message || 'Unknown'}`);
            };
            
            audio.play()
                .then(() => {
                    log(`▶️ Playing: ${path}`);
                })
                .catch(err => {
                    log(`❌ Play failed: ${err.message}`);
                });
        }
        
        // Test on load
        log('✅ Page loaded - ready to test sounds');
        log(`📍 Current URL: ${window.location.href}`);
    </script>
</body>
</html>
