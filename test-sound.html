<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Local Sounds</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #45a049;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🔊 Test Local Sound Files</h1>
    
    <div>
        <button onclick="testSound(1)">Test Sound 1</button>
        <button onclick="testSound(5)">Test Sound 5</button>
        <button onclick="testSound(10)">Test Sound 10</button>
        <button onclick="testSound(75)">Test Sound 75</button>
    </div>
    
    <div>
        <button onclick="testSound('winner')">Test Winner</button>
        <button onclick="testSound('notwinner')">Test Not Winner</button>
        <button onclick="testSound('shuffle')">Test Shuffle</button>
    </div>
    
    <div>
        <button onclick="testPreload()">Test Preload (1-20)</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div id="log"></div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        function testSound(num) {
            let soundPath;
            
            if (num === 'winner') {
                soundPath = '/sounds/winner.wav';
            } else if (num === 'notwinner') {
                soundPath = '/sounds/notwinner.wav';
            } else if (num === 'shuffle') {
                soundPath = '/sounds/shuffle-audio-TfqyAnvz.mp3';
            } else {
                soundPath = `/sounds/${num}.wav`;
            }
            
            log(`🔊 Testing: ${soundPath}`);
            
            const audio = new Audio(soundPath);
            audio.volume = 0.7;
            
            audio.addEventListener('loadeddata', () => {
                log(`✅ Loaded: ${soundPath} (duration: ${audio.duration.toFixed(2)}s)`);
            });
            
            audio.addEventListener('error', (e) => {
                log(`❌ Error loading: ${soundPath}`);
                log(`   Error: ${audio.error?.message || 'Unknown error'}`);
            });
            
            audio.play()
                .then(() => {
                    log(`▶️  Playing: ${soundPath}`);
                })
                .catch(err => {
                    log(`❌ Play failed: ${err.message}`);
                });
        }

        async function testPreload() {
            log('🔄 Starting preload test for sounds 1-20...');
            
            for (let i = 1; i <= 20; i++) {
                const soundPath = `/sounds/${i}.wav`;
                const audio = new Audio(soundPath);
                audio.preload = 'auto';
                
                audio.addEventListener('loadeddata', () => {
                    log(`✅ Preloaded: ${soundPath}`);
                });
                
                audio.addEventListener('error', () => {
                    log(`❌ Failed to preload: ${soundPath}`);
                });
                
                audio.load();
                
                // Small delay
                if (i % 5 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 10));
                }
            }
            
            log('✅ Preload test completed!');
        }

        // Test on page load
        window.addEventListener('load', () => {
            log('📄 Page loaded');
            log('🔍 Testing if sound files are accessible...');
            
            // Test if first sound exists
            fetch('/sounds/1.wav', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        log('✅ Sound files are accessible!');
                        log(`   Status: ${response.status}`);
                        log(`   Content-Type: ${response.headers.get('content-type')}`);
                    } else {
                        log(`❌ Sound files not accessible (Status: ${response.status})`);
                    }
                })
                .catch(err => {
                    log(`❌ Error checking sound files: ${err.message}`);
                });
        });
    </script>
</body>
</html>
